name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  repository_dispatch:
    types:
      - contentful_publish
  workflow_dispatch:

# Deployment is handled by Vercel's own Git integration, which builds and
# promotes to production on every push to master. This workflow used to also
# deploy via amondnet/vercel-action@v25, which pins Vercel CLI 25.1.0 — the
# Vercel API now rejects anything older than 47.2.2, so that step failed on
# every run since at least July while Vercel deployed the commit anyway.
#
# Rather than run a second, duplicate production deploy, this is now a build
# check: it catches a broken build in CI instead of leaving it to be discovered
# in a Vercel log. If you ever want CI to own deployment instead, disable the
# Vercel Git integration first so the two don't race.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs for the first time here: the repo had no ESLint config and the
      # script still called the `next lint` command that Next 16 removed.
      # Warnings do not fail the job; errors do.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
          NEXT_PUBLIC_FORMSPREE_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ID }}

      - name: Verify in-browser model matches PyTorch
        run: npm run verify:parity
